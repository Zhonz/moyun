name: Android Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web assets
      run: npm run build
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Debug APK
      run: |
        cd android
        
        # Set ANDROID_HOME and add to PATH
        export ANDROID_HOME="$HOME/android-sdk"
        export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
        
        # Download Android SDK if not present
        if [ ! -d "$ANDROID_HOME" ]; then
          mkdir -p "$ANDROID_HOME"
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/" 2>/dev/null || true
          rm cmdline-tools.zip
          cd -
        fi
        
        # Accept licenses and install required SDK components
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
        
        # Set environment variables for Gradle
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        export ANDROID_HOME="$ANDROID_HOME"
        
        # Make gradlew executable and run build
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Check APK output
      run: |
        echo "=== APK Output Directory ==="
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK directory not found"
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: inkverse-debug.apk
        path: android/app/build/outputs/apk/debug/*.apk
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/*.apk
        name: 墨韵 AI ${{ github.ref_name }}
        body: |
          ## 墨韵 AI ${{ github.ref_name }}
          
          ### 主要更新
          - Phase 3-4 性能优化
          - IndexedDB 缓存
          - 性能监控工具
          - APK 构建优化
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}