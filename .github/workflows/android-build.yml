name: Android Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Android project structure
      run: |
        echo "Checking Android project structure..."
        ls -la android/
        if [ ! -f "android/gradlew" ]; then echo "ERROR: gradlew not found!"; exit 1; fi
        if [ ! -f "android/build.gradle" ]; then echo "ERROR: build.gradle not found!"; exit 1; fi
        if [ ! -f "android/settings.gradle" ]; then echo "ERROR: settings.gradle not found!"; exit 1; fi
        if [ ! -f "android/app/build.gradle" ]; then echo "ERROR: app/build.gradle not found!"; exit 1; fi
        echo "✅ Android project structure OK!"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Generate or restore debug keystore
      run: |
        KEYSTORE_DIR="android/app"
        KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
        
        if [ ! -f "$KEYSTORE_FILE" ]; then
          echo "🔑 Generating stable debug keystore..."
          keytool -genkey -v -keystore "$KEYSTORE_FILE" \
            -storepass inkverse-debug \
            -alias inkverse-debug \
            -keypass inkverse-debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=inkverse, OU=inkverse, O=inkverse, L=Unknown, ST=Unknown, C=Unknown" 2>/dev/null || true
        fi
        
        echo "✅ Debug keystore ready!"
        ls -la $KEYSTORE_DIR/
    
    - name: Auto-increment version code
      run: |
        BUILD_FILE="android/app/build.gradle"
        
        # 读取当前版本
        CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' "$BUILD_FILE")
        CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$BUILD_FILE")
        NEW_CODE=$((CURRENT_CODE + 1))
        
        # 从tag获取版本名（如果有tag）
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # 移除v前缀
          NEW_NAME="${TAG_NAME#v}"
        else
          NEW_NAME="$CURRENT_NAME"
        fi
        
        # 更新build.gradle
        sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$BUILD_FILE"
        sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" "$BUILD_FILE"
        
        echo "✅ Version updated: versionCode=$NEW_CODE, versionName=$NEW_NAME"
        cat "$BUILD_FILE" | grep -E "versionCode|versionName"
    
    - name: Build web assets
      run: npm run build
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
    
    - name: Build with Gradle (Debug)
      run: |
        cd android
        echo "Starting Gradle build..."
        ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel
        echo "✅ Gradle build completed!"
        ls -la app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk