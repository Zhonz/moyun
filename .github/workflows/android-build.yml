name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Android project structure
      run: |
        echo "Checking Android project structure..."
        ls -la android/
        if [ ! -f "android/gradlew" ]; then echo "ERROR: gradlew not found!"; exit 1; fi
        if [ ! -f "android/build.gradle" ]; then echo "ERROR: build.gradle not found!"; exit 1; fi
        if [ ! -f "android/settings.gradle" ]; then echo "ERROR: settings.gradle not found!"; exit 1; fi
        if [ ! -f "android/app/build.gradle" ]; then echo "ERROR: app/build.gradle not found!"; exit 1; fi
        echo "✅ Android project structure OK!"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Auto-increment version
      run: |
        BUILD_FILE="android/app/build.gradle"
        # 获取当前versionCode
        CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' "$BUILD_FILE")
        NEW_CODE=$((CURRENT_CODE + 1))
        
        # 获取当前versionName（默认为1.0）
        CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$BUILD_FILE" || echo "1.0")
        
        # 从tag获取版本名（如果有tag）
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # 移除v前缀
          NEW_NAME="${TAG_NAME#v}"
        else
          # 如果没有tag，使用当前versionName + .build号
          NEW_NAME="${CURRENT_NAME}.${NEW_CODE}"
        fi
        
        # 更新build.gradle
        sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$BUILD_FILE"
        sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" "$BUILD_FILE"
        
        echo "✅ Version updated: versionCode=$NEW_CODE, versionName=$NEW_NAME"
        cat "$BUILD_FILE" | grep -E "versionCode|versionName"
    
    - name: Build web assets
      run: npm run build
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
    
    - name: Build with Gradle (Debug)
      run: |
        cd android
        echo "Starting Gradle build..."
        ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel
        echo "✅ Gradle build completed!"
        ls -la app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug.apk
        path: ./apk
    
    - name: Create Release
      run: |
        python3 << 'EOF'
        import os
        import requests
        import json
        
        token = os.environ['GITHUB_TOKEN']
        repo = os.environ['GITHUB_REPOSITORY']
        tag_name = os.environ['GITHUB_REF_NAME']
        
        headers = {
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        }
        
        # 检查Release是否已存在
        get_url = f'https://api.github.com/repos/{repo}/releases/tags/{tag_name}'
        get_response = requests.get(get_url, headers=headers)
        if get_response.status_code == 200:
            release_id = get_response.json()['id']
            print(f"Deleting existing release: {release_id}")
            requests.delete(f'https://api.github.com/repos/{repo}/releases/{release_id}', headers=headers)
        
        # 创建新的Release
        release_data = {
            'tag_name': tag_name,
            'name': f'墨韵 AI {tag_name}',
            'body': f'## 墨韵 AI {tag_name}\n\n### 主要更新\n- 增强续写功能\n- 热更新机制\n- 自动版本号递增',
            'draft': False,
            'prerelease': False
        }
        create_response = requests.post(f'https://api.github.com/repos/{repo}/releases', headers=headers, json=release_data)
        create_response.raise_for_status()
        release = create_response.json()
        
        # 获取上传URL
        upload_url = release['upload_url'].replace('{?name,label}', '')
        print(f"Upload URL: {upload_url}")
        
        # 上传APK
        apk_path = 'apk/app-debug.apk'
        if os.path.exists(apk_path):
            with open(apk_path, 'rb') as f:
                files = {'file': (f'inkverse-ai-{tag_name}.apk', f, 'application/vnd.android.package-archive')}
                upload_response = requests.post(f'{upload_url}?name=inkverse-ai-{tag_name}.apk', 
                                               headers={'Authorization': f'token {token}', 'Content-Type': 'application/vnd.android.package-archive'},
                                               data=f)
            upload_response.raise_for_status()
            print("✅ APK uploaded successfully")
        else:
            print("❌ APK file not found")
            import subprocess
            subprocess.run(['ls', '-la', 'apk/'])
            exit(1)
        EOF
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF_NAME: ${{ github.ref_name }}