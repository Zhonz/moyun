name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web assets
      run: npm run build
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      continue-on-error: true
    
    - name: Check APK output
      run: |
        echo "=== Checking APK output ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: inkverse-debug.apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 5
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/*.apk
        name: 墨韵 AI ${{ github.ref_name }}
        body: |
          ## 墨韵 AI ${{ github.ref_name }}
          
          ### 主要更新
          - Phase 3-4 性能优化
          - IndexedDB 缓存
          - 性能监控工具
          - APK 构建优化
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}