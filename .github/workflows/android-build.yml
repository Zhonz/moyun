name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Android project structure
      run: |
        echo "Checking Android project structure..."
        ls -la android/
        if [ ! -f "android/gradlew" ]; then echo "ERROR: gradlew not found!"; exit 1; fi
        if [ ! -f "android/build.gradle" ]; then echo "ERROR: build.gradle not found!"; exit 1; fi
        if [ ! -f "android/settings.gradle" ]; then echo "ERROR: settings.gradle not found!"; exit 1; fi
        if [ ! -f "android/app/build.gradle" ]; then echo "ERROR: app/build.gradle not found!"; exit 1; fi
        echo "✅ Android project structure OK!"
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Auto-increment version
      run: |
        BUILD_FILE="android/app/build.gradle"
        # 获取当前versionCode
        CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' "$BUILD_FILE")
        NEW_CODE=$((CURRENT_CODE + 1))
        
        # 获取当前versionName（默认为1.0）
        CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' "$BUILD_FILE" || echo "1.0")
        
        # 从tag获取版本名（如果有tag）
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # 移除v前缀
          NEW_NAME="${TAG_NAME#v}"
        else
          # 如果没有tag，使用当前versionName + .build号
          NEW_NAME="${CURRENT_NAME}.${NEW_CODE}"
        fi
        
        # 更新build.gradle
        sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$BUILD_FILE"
        sed -i "s/versionName \"$CURRENT_NAME\"/versionName \"$NEW_NAME\"/" "$BUILD_FILE"
        
        echo "✅ Version updated: versionCode=$NEW_CODE, versionName=$NEW_NAME"
        cat "$BUILD_FILE" | grep -E "versionCode|versionName"
    
    - name: Build web assets
      run: npm run build
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
    
    - name: Build with Gradle (Debug)
      run: |
        cd android
        echo "Starting Gradle build..."
        ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel
        echo "✅ Gradle build completed!"
        ls -la app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: app-debug.apk
        path: ./apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./apk/app-debug.apk
        name: 墨韵 AI ${{ github.ref_name }}
        body: |
          ## 墨韵 AI ${{ github.ref_name }}

          ### 主要更新
          - Phase 3-4 性能优化
          - IndexedDB 缓存
          - 性能监控工具
          - APK 构建优化
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}