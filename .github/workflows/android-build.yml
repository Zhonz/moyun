name: Android Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Android project structure
      run: |
        echo "Checking Android project structure..."
        ls -la android/
        if [ ! -f "android/gradlew" ]; then echo "ERROR: gradlew not found!"; exit 1; fi
        if [ ! -f "android/build.gradle" ]; then echo "ERROR: build.gradle not found!"; exit 1; fi
        if [ ! -f "android/settings.gradle" ]; then echo "ERROR: settings.gradle not found!"; exit 1; fi
        if [ ! -f "android/app/build.gradle" ]; then echo "ERROR: app/build.gradle not found!"; exit 1; fi
        echo "✅ Android project structure OK!"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web assets
      run: npm run build
    
    - name: Make Gradle executable
      run: chmod +x android/gradlew
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build with Gradle (Debug)
      run: |
        cd android
        echo "Starting Gradle build..."
        ./gradlew assembleDebug --stacktrace --no-daemon --info
        echo "✅ Gradle build completed!"
        ls -la app/build/outputs/apk/debug/
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        name: 墨韵 AI ${{ github.ref_name }}
        body: |
          ## 墨韵 AI ${{ github.ref_name }}
          
          ### 主要更新
          - 更新 DeepSeek 模型为最新的 V4 系列（v4-pro/v4-flash）
          - GitHub Actions 自动构建发布
          - 优化用户体验
          - 修复 Gradle 构建配置
          - 增加默认模型列表
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
