<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAFBFC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>墨韵 - AI小说创作与阅读</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- 页面容器 -->
        <div class="pages">
            <!-- 书架页 -->
            <div class="page page-bookshelf active" id="page-bookshelf">
                <div class="page-header">
                    <h1 class="page-title">书架</h1>
                </div>
                <div class="page-body" id="bookshelf-content">
                    <!-- 动态渲染 -->
                </div>
            </div>

            <!-- 创作页 -->
            <div class="page page-create" id="page-create">
                <div class="page-header">
                    <h1 class="page-title">创作</h1>
                    <button class="icon-btn" id="settings-toggle-btn" aria-label="设置">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
                <div class="page-body">
                    <!-- 创作步骤容器 -->
                    <div id="create-steps">
                        <!-- 步骤1：基本信息 -->
                        <div class="create-step active" id="step-info">
                            <div class="step-card">
                                <div class="step-number">1</div>
                                <h2 class="step-title">开始新小说</h2>
                                <div class="form-field">
                                    <label>小说名称</label>
                                    <input type="text" id="novel-title" placeholder="给你的小说起个名字" maxlength="50">
                                </div>
                                <div class="form-field">
                                    <label>题材描述</label>
                                    <textarea id="novel-genre-hint" placeholder="描述你想写的故事...&#10;&#10;例如：一个发生在民国时期的悬疑故事，主角是一位落魄侦探" rows="4"></textarea>
                                </div>
                                <div class="form-field">
                                    <label>篇幅</label>
                                    <div class="genre-select" id="genre-select">
                                        <button class="genre-btn" data-genre="short" data-chapters="20">
                                            <span class="genre-label">短篇</span>
                                            <span class="genre-desc">10-30章</span>
                                        </button>
                                        <button class="genre-btn active" data-genre="medium" data-chapters="50">
                                            <span class="genre-label">中篇</span>
                                            <span class="genre-desc">30-100章</span>
                                        </button>
                                        <button class="genre-btn" data-genre="long" data-chapters="150">
                                            <span class="genre-label">长篇</span>
                                            <span class="genre-desc">100+章</span>
                                        </button>
                                        <button class="genre-btn" data-genre="ultra" data-chapters="300">
                                            <span class="genre-label">超长篇</span>
                                            <span class="genre-desc">300+章</span>
                                        </button>
                                    </div>
                                </div>
                                <button class="primary-btn" id="generate-outline-btn">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                    生成大纲
                                </button>
                            </div>
                        </div>

                        <!-- 步骤2：大纲确认 -->
                        <div class="create-step" id="step-outline">
                            <div class="step-card">
                                <div class="step-number">2</div>
                                <h2 class="step-title">大纲与伏笔</h2>
                                <div class="outline-section" id="outline-display">
                                    <div class="outline-loading" id="outline-loading" style="display:none;">
                                        <div class="spinner"></div>
                                        <span>正在构思大纲...</span>
                                    </div>
                                    <div id="outline-content" style="display:none;">
                                        <div class="outline-block">
                                            <h3>故事大纲</h3>
                                            <div id="outline-text" class="outline-text"></div>
                                        </div>
                                        <div class="outline-block">
                                            <h3>伏笔设计</h3>
                                            <div id="foreshadowing-text" class="outline-text"></div>
                                        </div>
                                        <div class="outline-block">
                                            <h3>写法说明</h3>
                                            <div id="writing-style-text" class="outline-text"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="step-actions" id="outline-actions" style="display:none;">
                                    <button class="secondary-btn" id="regenerate-outline-btn">重新生成</button>
                                    <button class="primary-btn" id="confirm-outline-btn">确认大纲，开始写作</button>
                                </div>
                            </div>
                        </div>

                        <!-- 步骤3：章节生成 -->
                        <div class="create-step" id="step-writing">
                            <div class="step-card">
                                <div class="step-number">3</div>
                                <h2 class="step-title">逐章创作</h2>
                                <div class="writing-progress" id="writing-progress">
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="progress-fill"></div>
                                    </div>
                                    <div class="progress-text" id="progress-text">准备中...</div>
                                </div>
                                <div class="chapter-list" id="chapter-list">
                                    <!-- 动态渲染章节 -->
                                </div>
                                <div class="step-actions">
                                    <button class="primary-btn" id="start-writing-btn">开始逐章生成</button>
                                    <button class="secondary-btn" id="stop-writing-btn" style="display:none;">暂停生成</button>
                                    <button class="secondary-btn" id="go-to-bookshelf-btn">去书架阅读</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 我的页 -->
            <div class="page page-profile" id="page-profile">
                <div class="page-header">
                    <h1 class="page-title">我的</h1>
                    <button class="icon-btn" id="theme-toggle-btn" aria-label="切换主题">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                </div>
                <div class="page-body">
                    <div class="profile-section">
                        <h3 class="section-title">API 配置</h3>
                        <div class="form-field">
                            <label>AI 提供商</label>
                            <select id="provider-select">
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="deepseek">DeepSeek</option>
                                <option value="qwen">阿里千问</option>
                                <option value="glm">智谱 AI</option>
                                <option value="moonshot">月之暗面</option>
                                <option value="doubao">字节豆包</option>
                                <option value="yi">零一万物</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>API Key</label>
                            <input type="password" id="api-key" placeholder="sk-...">
                        </div>
                        <div class="form-field" id="custom-endpoint-group" style="display:none;">
                            <label>自定义端点</label>
                            <input type="text" id="custom-endpoint" placeholder="https://api.example.com/v1/chat">
                        </div>
                        <div class="form-field">
                            <label>模型</label>
                            <div style="display:flex;gap:8px;">
                                <select id="model-select" style="flex:1;"></select>
                                <button class="icon-btn" id="refresh-models-btn" title="刷新">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-field">
                            <label style="display:flex;align-items:center;gap:8px;">
                                <input type="checkbox" id="enable-thinking"> 启用思考模式
                            </label>
                            <span class="field-hint">让模型先思考再回答（仅部分模型支持）</span>
                        </div>
                        <div class="form-field">
                            <label style="display:flex;align-items:center;gap:8px;">
                                <input type="checkbox" id="show-thinking"> 显示思考过程
                            </label>
                        </div>
                        <button class="primary-btn" id="save-settings-btn">保存设置</button>
                    </div>
                    <div class="profile-section">
                        <h3 class="section-title">创作统计</h3>
                        <div class="stats-grid" id="stats-grid">
                            <!-- 动态渲染 -->
                        </div>
                    </div>
                    <div class="profile-section">
                        <h3 class="section-title">关于</h3>
                        <div class="menu-list">
                            <button class="menu-item" id="show-terms-btn">
                                <span>用户协议</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                            <button class="menu-item" id="show-privacy-btn">
                                <span>隐私政策</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                            <button class="menu-item" id="show-about-btn">
                                <span>关于墨韵</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="bookshelf">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span>书架</span>
            </button>
            <button class="nav-item" data-page="create">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>创作</span>
            </button>
            <button class="nav-item" data-page="profile">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>我的</span>
            </button>
        </nav>

        <!-- 阅读器覆盖层 -->
        <div class="reader-overlay" id="reader-overlay" style="display:none;">
            <div class="reader-header" id="reader-header">
                <button class="reader-back-btn" id="reader-back-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <div class="reader-title-info">
                    <div class="reader-book-title" id="reader-book-title"></div>
                    <div class="reader-chapter-title" id="reader-chapter-title"></div>
                </div>
            </div>
            <div class="reader-body" id="reader-body">
                <div class="reader-content" id="reader-content"></div>
            </div>
            <div class="reader-footer" id="reader-footer">
                <button class="chapter-nav-btn" id="prev-chapter-btn">上一章</button>
                <span class="chapter-indicator" id="chapter-indicator">1 / 1</span>
                <button class="chapter-nav-btn" id="next-chapter-btn">下一章</button>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- 用户协议确认弹窗（首次启动） -->
        <div class="modal-overlay" id="consent-modal" style="display:none;">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h2>欢迎使用墨韵</h2>
                </div>
                <div class="modal-body">
                    <p>在使用本应用之前，请您阅读并同意以下协议：</p>
                    <div class="consent-checkboxes">
                        <label>
                            <input type="checkbox" id="consent-terms">
                            <span>我已阅读并同意 <button class="link-btn" id="consent-terms-link">《用户协议》</button></span>
                        </label>
                        <label>
                            <input type="checkbox" id="consent-privacy">
                            <span>我已阅读并同意 <button class="link-btn" id="consent-privacy-link">《隐私政策》</button></span>
                        </label>
                    </div>
                    <div class="consent-hint">
                        您的数据仅存储在本地设备中，不会上传至任何服务器。
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="primary-btn" id="consent-accept-btn">同意并继续</button>
                </div>
            </div>
        </div>

        <!-- 通用内容弹窗 -->
        <div class="modal-overlay" id="content-modal" style="display:none;">
            <div class="modal-dialog content-modal-dialog">
                <div class="modal-header">
                    <h2 id="content-modal-title">标题</h2>
                    <button class="modal-close-btn" id="content-modal-close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="modal-body" id="content-modal-body">
                    <!-- 动态内容 -->
                </div>
                <div class="modal-footer">
                    <button class="primary-btn" id="content-modal-close-btn">关闭</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
