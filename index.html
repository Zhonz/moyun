<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D0D0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>墨韵 AI - 专注AI创作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">墨</div>
                <h1 class="header-title">墨韵 AI</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn theme-toggle-btn" id="theme-toggle-btn" aria-label="切换主题">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="settings-btn" aria-label="设置">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <section class="categories-section">
                <div class="categories-scroll" id="categories">
                </div>
            </section>

            <section class="templates-section">
                <div class="templates-grid" id="templates">
                </div>
            </section>

            <section class="input-section">
                <div class="mode-switch">
                    <button class="mode-btn active" id="mode-create" data-mode="create">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                        创作模式
                    </button>
                    <button class="mode-btn" id="mode-chat" data-mode="chat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        对话模式
                    </button>
                </div>

                <div class="create-panel" id="create-panel">
                    <div class="options-row">
                        <div class="options-group">
                            <span class="options-label">风格</span>
                            <div class="style-chips" id="style-select">
                            </div>
                        </div>
                        <div class="options-group">
                            <span class="options-label">长度</span>
                            <div class="length-chips" id="length-select">
                            </div>
                        </div>
                    </div>
                    <textarea class="prompt-input" id="prompt-input" placeholder="描述你的创作想法...&#10;&#10;例如：&#10;• 一个发生在民国时期的爱情故事&#10;• 主角是一个失意的作家&#10;• 描写雨夜中相遇的场景"></textarea>
                    <div class="creativity-control">
                        <span>创意程度</span>
                        <span class="creativity-value" id="creativity-value">0.7</span>
                    </div>
                    <input type="range" class="creativity-slider" id="creativity-slider" min="0" max="1" step="0.1" value="0.7">
                    <div class="actions-row">
                        <button class="generate-btn" id="generate-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                            开始创作
                        </button>
                        <button class="continue-btn" id="continue-btn">续写</button>
                        <button class="manage-templates-btn" id="manage-templates-btn">管理模板</button>
                    </div>
                    <div class="loading-indicator" id="loading-indicator" style="display: none;">
                        <div class="spinner"></div>
                        <span>正在创作中...</span>
                    </div>
                </div>

                <div class="chat-panel" id="chat-panel" style="display: none;">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-welcome">
                            <div class="chat-avatar">墨</div>
                            <div class="chat-message bot">
                                你好！我是墨韵AI写作助手。我可以帮你创作小说、诗歌、文章，或者陪你讨论写作话题。有什么我可以帮你的吗？
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <textarea class="chat-input" id="chat-input" placeholder="输入你的问题或想法..." rows="1"></textarea>
                        <button class="chat-send-btn" id="chat-send-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <section class="output-section" id="result">
            </section>

            <section class="history-section">
                <div class="history-header">
                    <h3 class="history-title">历史创作</h3>
                    <div class="history-actions-bar">
                        <input type="text" class="search-input" id="search-input" placeholder="搜索历史...">
                        <button class="batch-export-btn" id="batch-export-btn" title="批量导出">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            导出全部
                        </button>
                    </div>
                </div>
                <div class="history-list" id="history">
                </div>
            </section>
        </main>

        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h2>API 设置</h2>
                <button class="close-settings" id="close-settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="settings-content">
                <div class="form-group">
                    <label>AI 提供商</label>
                    <select id="provider-select">
                        <option value="openai">OpenAI (GPT-4)</option>
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="qwen">阿里千问</option>
                        <option value="glm">智谱 AI</option>
                        <option value="moonshot">月之暗面</option>
                        <option value="doubao">字节豆包</option>
                        <option value="yi">零一万物</option>
                        <option value="custom">自定义 API</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="sk-...">
                </div>
                <div class="form-group" id="custom-endpoint-group">
                    <label>自定义端点</label>
                    <input type="text" id="custom-endpoint" placeholder="https://api.example.com/v1/chat">
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <div style="display: flex; gap: 8px;">
                        <select id="model-select" style="flex: 1;">
                        </select>
                        <button class="refresh-models-btn" id="refresh-models-btn" title="刷新模型">🔄</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>自动获取模型</label>
                    <button class="auto-fetch-models-btn" id="auto-fetch-models-btn">
                        从提供商 API 获取模型列表
                    </button>
                    <div class="model-update-info" id="model-update-info" style="margin-top: 8px; font-size: 12px; color: var(--ink-wash);"></div>
                </div>
                <div class="form-group">
                    <label>手动添加模型</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="manual-model-input" placeholder="例如：deepseek-chat" style="flex: 1;">
                        <button id="add-manual-model-btn" style="padding: 8px 12px;">添加</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>当前模型列表</label>
                    <div id="current-models-list" style="max-height: 150px; overflow-y: auto; background: var(--charcoal); padding: 8px; border-radius: 8px; font-size: 12px;"></div>
                </div>
                <button class="save-settings-btn" id="save-settings-btn">保存设置</button>
            </div>
        </div>

        <div class="toast" id="toast"></div>

        <div class="templates-panel" id="templates-panel">
            <div class="templates-header">
                <h2>自定义模板管理</h2>
                <button class="close-templates" id="close-templates">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="templates-content">
                <div class="add-template-form">
                    <h3>添加新模板</h3>
                    <div class="form-group">
                        <label>模板名称</label>
                        <input type="text" id="new-template-name" placeholder="例如：神秘日记">
                    </div>
                    <div class="form-group">
                        <label>提示词（使用{theme}代替用户输入）</label>
                        <textarea id="new-template-prompt" placeholder="例如：请以{theme}为主题，写一篇神秘的日记..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>示例</label>
                        <input type="text" id="new-template-example" placeholder="例如：一封来自未来的信">
                    </div>
                    <button class="add-template-btn" id="add-template-btn">添加模板</button>
                </div>
                <div class="custom-templates-list">
                    <h3>我的模板</h3>
                    <div id="custom-templates-container"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
